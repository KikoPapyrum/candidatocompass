    compass_flag: PASAPORTE_ORIGEN_ANVERSO
  - id: PASAPORTE_ORIGEN_REVERSO
    label: Pasaporte Origen Reverso
    kulteo_flags: [PASAPORTE_ORIGEN_REVERSO]
    compass_typology: Pasaporte Origen Reverso
    compass_flag: PASAPORTE_ORIGEN_REVERSO
  - id: certificate_of_negative_sexual_offenses
