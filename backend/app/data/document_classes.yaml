# Document classes requested in the simulator.
# compass_typology: document type created with POST /items
# compass_flag: metadata field on the Empleado folder (request Sí/No)
# from_template: create from Compass template (metadata only, no file)

document_classes:
  - id: national_identity_document_front
    label: DNI Anverso
    kulteo_flags: [DNI_ANVERSO]
    compass_typology: DNI Anverso
    compass_flag: DNI_ANVERSO
  - id: national_identity_document_back
    label: DNI Reverso
    kulteo_flags: [DNI_REVERSO]
    compass_typology: DNI Reverso
    compass_flag: DNI_REVERSO
  - id: PASAPORTE_ORIGEN_ANVERSO
